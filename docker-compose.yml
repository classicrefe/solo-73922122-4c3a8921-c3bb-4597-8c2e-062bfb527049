services:
  api:
    build: .
    image: citation-stats:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CITATION_DB_PATH: /data/citations.db
      CITATION_SEED_FILE: /app/seed/papers.json
    volumes:
      - citation-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  citation-data:
